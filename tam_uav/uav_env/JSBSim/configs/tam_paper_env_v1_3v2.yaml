env_type: jsbsim_tam_paper
paper_environment_mode: tam_paper_env_v1
dynamics_backend: jsbsim
jsbsim_model_root: uav_env/JSBSim/data
simulation_frequency: 60
reference_lat: 60.0
reference_lon: 120.0
reference_alt: 0.0
controlled_side: red
initial_perturbation: none
published_parameters:
  simulation_frequency_hz: 60
  decision_frequency_hz: 5
  physics_frames_per_action: 12
  episode_limit_steps: 1000
  maximum_speed_mps: 400.0
  minimum_safe_altitude_m: 750.0
  maximum_aircraft_overload_g: 9.0
  maximum_attack_range_m: 14000.0
  launch_interval_s: 25.0
  maximum_overload_g: 30.0
  navigation_gain_y: 3.0
  navigation_gain_z: 3.0
inferred_parameters:
  # Paper does not publish the following engineering parameters.
  combat_zone_radius_m: 50000.0
  uav_direct_detection_range_m: 20000.0
  mav_detection_range_m: 80000.0
  position_norm_m: 50000.0
  altitude_norm_m: 12000.0
  situation_height_norm_m: 12000.0
  max_incoming_missiles: 8
  minimum_launch_range_m: 300.0
  missile_initial_speed_mps: 500.0
  powered_duration_s: 3.0
  powered_acceleration_mps2: 110.0
  maximum_missile_speed_mps: 1000.0
  missile_max_flight_time_s: 60.0
  hit_radius_m: 60.0
  drag_coefficient: 0.00012
  missile_speed_reward_norm_mps: 1000.0
  optimal_altitude_m: 6000.0
  maximum_altitude_m: 12000.0
  mav_d_danger_m: 5000.0
  mav_d_safe_m: 14000.0
  mav_d_opt_m: 10000.0
  mav_d_max_m: 30000.0
  mav_death_penalty: 200.0
  mav_team_kill_bonus: 200.0
  mav_team_kill_bonus_cap: 400.0
  reward_global_scale: 1.0
  reset_warmup_seconds: 35.0
  reset_warmup_throttle: 0.9
  direct_fcs_static_trim_by_model:
    f16: {throttle: 0.0, aileron: -0.0256410256, elevator: -0.0256410256, rudder: -0.0256410256}
    f22: {throttle: 0.0, aileron: -0.0256410256, elevator: -0.0256410256, rudder: -0.0256410256}
initial_perturbation_levels:
  low: {altitude_m: 500.0, longitude_deg: 0.005, latitude_deg: 0.005, heading_deg: 5.0, speed_mps: 20.0}
  medium: {altitude_m: 1000.0, longitude_deg: 0.01, latitude_deg: 0.01, heading_deg: 10.0, speed_mps: 35.0}
  large: {altitude_m: 1500.0, longitude_deg: 0.015, latitude_deg: 0.015, heading_deg: 15.0, speed_mps: 50.0}
aircraft_type_params:
  mav:
    aircraft_model: f22
    model_path: aircraft/f22/f22.xml
    role: mav
    radar_range: 80000.0
    missile_num: 0
    max_speed_scale: 1.0
    max_g: 9.0
    reward_role: mav
  attack_uav:
    aircraft_model: f16
    model_path: aircraft/f16/f16.xml
    role: attack_uav
    radar_range: 20000.0
    missile_num: 2
    max_speed_scale: 1.0
    max_g: 9.0
    reward_role: attack_uav
max_red_agents: 3
max_blue_agents: 2
red_agents:
  - {id: red_0, type: mav, role: mav, lon_deg: 120.02, lat_deg: 59.98, altitude_m: 6000.0, speed_mps: 250.0, heading_deg: 0.0}
  - {id: red_1, type: attack_uav, role: attack_uav, lon_deg: 120.0, lat_deg: 60.0, altitude_m: 6000.0, speed_mps: 250.0, heading_deg: 0.0}
  - {id: red_2, type: attack_uav, role: attack_uav, lon_deg: 120.04, lat_deg: 60.0, altitude_m: 6000.0, speed_mps: 250.0, heading_deg: 0.0}
blue_agents:
  - {id: blue_0, type: attack_uav, role: attack_uav, lon_deg: 120.0, lat_deg: 60.2, altitude_m: 6000.0, speed_mps: 250.0, heading_deg: 180.0}
  - {id: blue_1, type: attack_uav, role: attack_uav, lon_deg: 120.04, lat_deg: 60.2, altitude_m: 6000.0, speed_mps: 250.0, heading_deg: 180.0}
