# mav_guided_v1 main-method config, not a launch-gate diagnostic config.
# It keeps the BRMA 3-9 line / TA90, lock delay, cooldown, and deconfliction.
# Red UAV launch tracks prefer MAV shared information when it is available,
# while preserving direct fallback for early-training learnability.
# This config does not change reward, missile dynamics, hit model, PID,
# aircraft XML, blue rule, action space, or observation dimension.
action_trim_by_role:
  mav:
    heading: 0.0
    pitch: 0.0
    speed: 0.0
agent_interaction_steps: 12
aircraft_type_params:
  attack_uav:
    aircraft_model: f16
    role: attack_uav
    num_missiles: 2
  interceptor_uav:
    aircraft_model: f16
    role: interceptor_uav
    num_missiles: 2
  mav:
    aircraft_model: f16
    role: mav
    num_missiles: 0
  scout_uav:
    aircraft_model: f16
    role: scout_uav
    num_missiles: 0
blue_agent_types:
- attack_uav
- attack_uav
enable_gcas_for_blue: true
env_type: jsbsim_hetero
hetero_reward_mode: tam_brma_paper_aligned_v1
red_uav_track_policy: mav_preferred_when_alive
red_target_selection_mode: closest
missile_launch_ao_deg: 60.0
missile_launch_ta_deg: 90.0
missile_launch_range_m: 14000.0
missile_launch_min_range_m: 500.0
missile_attack_interval_sec: 25.0
tam_brma_paper_aligned_v1:
  mav_reward_scale: 0.05
  mav_safety:
    dist_weight: 0.5
    threat_weight: 0.3
    aspect_weight: 0.2
    d_danger_m: 8000.0
    d_safe_m: 15000.0
  mav_support:
    pos_weight: 0.6
    aware_weight: 0.4
    d_opt_m: 8000.0
    d_max_m: 25000.0
  mav_event:
    death_penalty_raw: 200.0
    team_credit_per_kill_raw: 100.0
    team_credit_cap_raw: 200.0
  uav:
    include_r_death: false
  logging:
    log_removed_mav_r_adv: true
    log_removed_mav_r_end: true
    log_shared_track_only: true
initial_states:
  blue_0:
    altitude_m: 6000
    lat: 60.2
    lon: 120.0
    speed_mps: 250
    yaw_deg: 180.0
  blue_1:
    altitude_m: 6000
    lat: 60.2
    lon: 120.04
    speed_mps: 250
    yaw_deg: 180.0
  red_0:
    altitude_m: 6500
    lat: 59.98
    lon: 120.02
    speed_mps: 230
    yaw_deg: 0.0
  red_1:
    altitude_m: 6000
    lat: 60.0
    lon: 120.0
    speed_mps: 250
    yaw_deg: 0.0
  red_2:
    altitude_m: 6000
    lat: 60.0
    lon: 120.04
    speed_mps: 250
    yaw_deg: 0.0
mav_observation_range_m: 80000
max_num_blue: 2
max_num_red: 3
max_steps: 1000
observation_mode: mav_shared_geo
red_agent_types:
- mav
- attack_uav
- attack_uav
sim_freq: 60
suppress_jsbsim_output: true
uav_direct_observation_range_m: 10000.0
pid_profile_by_role:
  mav: f16_default
  attack_uav: f16_default
  interceptor_uav: f16_default
acmi_visual_by_role:
  mav: f22
  attack_uav: f16
