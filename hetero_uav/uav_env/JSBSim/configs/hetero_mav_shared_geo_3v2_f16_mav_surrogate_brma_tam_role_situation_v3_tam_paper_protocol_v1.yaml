hetero_reward_mode: brma_tam_role_situation_v3
missile_evasion:
  mode: brma_scripted
  teams: red_only
red_target_selection_mode: closest
initial_states:
  blue_0:
    altitude_m: 6000
    lat: 60.2
    lon: 120.0
    speed_mps: 250
    yaw_deg: 180.0
  blue_1:
    altitude_m: 6000
    lat: 60.2
    lon: 120.04
    speed_mps: 250
    yaw_deg: 180.0
  red_0:
    altitude_m: 6500
    lat: 59.98
    lon: 120.02
    speed_mps: 230
    yaw_deg: 0.0
  red_1:
    altitude_m: 6000
    lat: 60.0
    lon: 120.0
    speed_mps: 250
    yaw_deg: 0.0
  red_2:
    altitude_m: 6000
    lat: 60.0
    lon: 120.04
    speed_mps: 250
    yaw_deg: 0.0
mav_observation_range_m: 80000
max_num_blue: 2
max_num_red: 3
max_steps: 1000
observation_mode: mav_shared_geo
red_agent_types:
- mav
- attack_uav
- attack_uav
sim_freq: 60
suppress_jsbsim_output: true
uav_direct_observation_range_m: 10000.0
