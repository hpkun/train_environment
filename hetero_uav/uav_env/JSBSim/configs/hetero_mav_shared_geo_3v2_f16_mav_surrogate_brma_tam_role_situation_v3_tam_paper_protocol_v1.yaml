  interceptor_uav: f16_default
acmi_visual_by_role:
  mav: f22
  attack_uav: f16
brma_tam_role_situation_v3:
  contract_revision: 5
  task:
    attrition_scale: 10.0
    attack_uav_loss_weight: 1.0
    mav_loss_weight: 0.75
    decisive_win_bonus: 10.0
    decisive_loss_penalty: -10.0
    timeout_advantage_bonus: 2.0
  situation:
    softmax_temperature: 0.2
    threat_weight: 1.0
    local_weight: 0.6
    team_weight: 0.4
    speed_modulation_min: 0.75
    speed_modulation_max: 1.0
    distance_optimal_low_ratio: 0.35
    distance_optimal_high_ratio: 0.75
  mav:
    marginal_information_weight: 0.5
    support_position_weight: 0.3
    threat_weight: 0.4
    role_scale: 0.05
    support_min_distance_ratio: 0.5
    support_max_distance_ratio: 1.5
    rear_reference_ratio: 0.75
  uav:
    situation_scale: 0.05
  flight:
    mav_scale: 0.01
    uav_scale: 0.01
missile_launch_range_m: 14000.0
missile_attack_interval_sec: 25.0
missile_guidance:
  mode: pn
  navigation_gain: 3.0
  max_overload_g: 30.0
missile_protocol:
  missile_protocol_version: tam_paper_protocol_v1
  missile_alignment_claim: paper-aligned kinematic approximation, not exact missile
    reproduction
  missile_attack_range_m: 14000.0
  missile_attack_interval_sec: 25.0
  missile_navigation_gain: 3.0
  missile_max_overload_g: 30.0
  missile_mass_kg: 84.0
  missile_length_m: 2.87
  missile_diameter_m: 0.127
  missile_unmodeled_parameters:
  - missile_mass_kg
  - missile_length_m
  - missile_diameter_m
